[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
# dash ships a pytest plugin with old-style hooks that pytest>=9.2 rejects; tests do not use dash.testing.
addopts = "-p no:dash"
